version: '3.8'

services:
  todo-gpt:
    build: .
    image: todo-gpt:latest
    container_name: todo-gpt
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/usr/src/app/data
      - ./backups:/usr/src/app/backups
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s